name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/firma.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/firma.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto KEYSTORE_B64: el APK se firma con una clave temporal y no podrá actualizar a versiones anteriores."
          fi

      - name: Compilar
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: Publicar versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "recordatorios-1.0.$N.apk"
          gh release create "v1.0.$N" "recordatorios-1.0.$N.apk" \
            --title "Recordatorios 1.0.$N" \
            --notes "Compilación automática. Descargá el APK desde el celular e instalalo."
